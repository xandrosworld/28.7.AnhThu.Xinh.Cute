<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · DNP Logistics WMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body data-page="login">
  <main class="content" style="max-width:460px;margin:8vh auto">
    <section class="panel">
      <div class="brand" style="margin-bottom:24px">
        <span class="brand-mark">DNP</span>
        <span><b>DNP Logistics</b><small>QUẢN LÝ KHO HÀNG</small></span>
      </div>
      <h1>Đăng nhập hệ thống</h1>
      <p>Dùng tài khoản được cấp theo vai trò nghiệp vụ.</p>
      <form id="login-form">
        <label>Tên đăng nhập
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>Mật khẩu
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-alert" class="alert danger" aria-live="polite"></p>
        <button class="btn primary" type="submit">Đăng nhập</button>
      </form>
      <p class="subtext">Demo: <b>admin / Admin@123</b> · <b>cs / CS@12345</b> · <b>warehouse / Kho@12345</b></p>
    </section>
  </main>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
